name: ToneDock desktop
on:
  push:
    paths: ['ToneDock/**', '.github/workflows/tonedock.yml']
  pull_request:
    paths: ['ToneDock/**', '.github/workflows/tonedock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S ToneDock -B ToneDock/build -A x64 -DBUILD_TESTING=ON
      - name: Configure macOS universal
        if: runner.os == 'macOS'
        run: cmake -S ToneDock -B ToneDock/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DBUILD_TESTING=ON
      - name: Build standalone and plugins
        run: python ToneDock/tools/ci_step.py "Build standalone and plugins" -- cmake --build ToneDock/build --config Release --parallel 2
      - name: Audio and library tests
        run: python ToneDock/tools/ci_step.py "Audio and library tests" -- ctest --test-dir ToneDock/build -C Release --output-on-failure
      - name: Package dependency notices
        run: python ToneDock/tools/package_notices.py --build ToneDock/build
      - name: Validate AU
        if: runner.os == 'macOS'
        run: python ToneDock/tools/ci_step.py "Validate AU" -- bash ToneDock/tools/validate_au.sh ToneDock/build/ToneDock_artefacts/Release/AU/ToneDock.component
      - name: Archive macOS bundles with executable permissions
        if: runner.os == 'macOS'
        run: python ToneDock/tools/ci_step.py "Archive macOS bundles" -- python ToneDock/tools/package_macos.py --build ToneDock/build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ToneDock-${{ runner.os }}-diagnostics
          path: ToneDock/build/ci-logs/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ToneDock-${{ runner.os }}-development
          path: |
            ToneDock/build/ToneDockApp_artefacts/Release/
            ToneDock/build/ToneDock_artefacts/Release/VST3/
            ToneDock/build/ToneDock_artefacts/Release/AU/
            ToneDock/packaging/
            ToneDock/build/notices/
            ToneDock/README.md
            ToneDock/docs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ToneDock-macOS-development
          path: ToneDock/build/ToneDock-macOS-development.tar.gz
          if-no-files-found: error
